openapi: 3.1.0

info:
  title: OBD2 API
  version: 1.0.0
  description: API para la aplicación de diagnóstico vehicular.

servers:
  - url: http://localhost:8080

paths:
  /api/v1/auth/google:
    post:
      tags:
        - Authentication
      summary: Login con Google
      description: |
        Autentica un usuario utilizando un idToken generado por Google.

        Si el usuario no existe, el sistema lo registra automáticamente
        y devuelve un JWT para acceder a los demás microservicios.
      operationId: loginWithGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'             
      responses:
        '200':
          description: Login exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expiresIn: 3600
                tokenType: Bearer
                user:
                  id: c8d2f4c1-3f8e-4b72-9d4d-1d3c1d8a8e11
                  firstName: Sebastián
                  lastName: Fajardo
                  email: sebastian@email.com
                  photoUrl: https://lh3.googleusercontent.com/...
        '401':
          description: Token de Google inválido.
        '500':
          description: Error interno del servidor.

  /api/v1/vehicles:
    get:
      tags:
        - Vehicles
      summary: Lista los vehículos del usuario autenticado
      operationId: listVehicles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Vehículos asociados a la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
        '401':
          description: Access Token inválido o vencido.
    post:
      tags:
        - Vehicles
      summary: Registra un vehículo del usuario autenticado
      operationId: createVehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: Vehículo registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          description: Datos inválidos o faltantes.
        '401':
          description: Access Token inválido o vencido.
        '409':
          description: Ya existe un vehículo con esa placa en la cuenta.

  /api/v1/vehicles/{vehicleId}:
    get:
      tags:
        - Vehicles
      summary: Consulta el detalle de un vehículo propio
      operationId: getVehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Vehículo de la cuenta autenticada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '401':
          description: Access Token inválido o vencido.
        '404':
          description: El vehículo no existe o no pertenece a la cuenta.

  /api/v1/vehicles/{vehicleId}/vin:
    patch:
      tags:
        - Vehicles
      summary: Registra o corrige el VIN de un vehículo propio
      operationId: updateVehicleVin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleVinRequest'
      responses:
        '200':
          description: Vehículo actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          description: VIN inválido.
        '401':
          description: Access Token inválido o vencido.
        '404':
          description: El vehículo no existe o no pertenece a la cuenta.

components:
  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:

    GoogleLoginRequest:
      type: object
      required:
        - idToken
      properties:
        idToken:
          type: string
          description: Token de identidad generado por Google.

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          example: Sebastián
        lastName:
          type: string
          example: Fajardo
        email:
          type: string
          format: email
          example: sebastian@gmail.com
        photoUrl:
          type: string
          example: https://lh3.googleusercontent.com/...

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 3600
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'

    CreateVehicleRequest:
      type: object
      required:
        - plate
        - brand
        - model
        - year
        - currentMileage
      properties:
        nickname:
          type: [string, 'null']
          maxLength: 60
        plate:
          type: string
          example: ABC123
        vin:
          type: [string, 'null']
          description: VIN de 17 caracteres. Puede ser null mientras no esté disponible.
        brand:
          type: string
          example: Chevrolet
        model:
          type: string
          example: Onix
        year:
          type: integer
          example: 2022
        currentMileage:
          type: integer
          minimum: 0
          example: 48500
        engine:
          type: [string, 'null']
        fuelType:
          type: [string, 'null']
          example: GASOLINE
        transmission:
          type: [string, 'null']
          example: AUTOMATIC

    Vehicle:
      allOf:
        - $ref: '#/components/schemas/CreateVehicleRequest'
        - type: object
          required:
            - vehicleId
          properties:
            vehicleId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    UpdateVehicleVinRequest:
      type: object
      required:
        - vin
      properties:
        vin:
          type: [string, 'null']
          description: VIN de 17 caracteres o null cuando sigue pendiente.

    VehicleListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
